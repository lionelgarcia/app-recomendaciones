<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecomiendaYa - App de Recomendaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>RecomiendaYa</h1>
        <p>Compartí tus series y películas favoritas</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Agregar recomendación</h2>

            <form>
                <div class="campo">
                    <label for="titulo">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ej: Stranger Things"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="genero">Género</label>
                    <select id="genero" name="genero" required>
                        <option value="">Seleccioná un género</option>
                        <option value="accion">Acción</option>
                        <option value="aventura">Aventura</option>
                        <option value="comedia">Comedia</option>
                        <option value="drama">Drama</option>
                        <option value="terror">Terror</option>
                        <option value="romance">Romance</option>
                        <option value="ciencia-ficcion">Ciencia ficción</option>
                        <option value="animacion">Animación</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo de contenido</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Seleccioná una opción</option>
                        <option value="pelicula">Película</option>
                        <option value="serie">Serie</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="puntuacion">Puntuación (1 a 10)</label>
                    <input
                        type="number"
                        id="puntuacion"
                        name="puntuacion"
                        min="1"
                        max="10"
                        placeholder="Ej: 9"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="fecha">Fecha de lanzamiento</label>
                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="portada">URL de portada</label>
                    <input
                        type="url"
                        id="portada"
                        name="portada"
                        placeholder="https://ejemplo.com/imagen.jpg"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="motivo">¿Por qué la recomendás?</label>
                    <textarea
                        id="motivo"
                        name="motivo"
                        rows="5"
                        placeholder="Escribí una breve reseña..."
                        required
                    ></textarea>
                </div>

                <div class="campo checkbox">
                    <input
                        type="checkbox"
                        id="favorito"
                        name="favorito"
                    >
                    <label for="favorito">Marcar como recomendación destacada</label>
                </div>

                <button type="submit">Publicar recomendación</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Proyecto App de Recomendaciones - 2026</p>
    </footer>

</body>
</html>
